    d="M20 160 H92 L100 172 L94 184 H20 Z"/>
  <path fill="#57534e"
    d="M180 160 H108 L114 170 L104 184 H180 Z"/>
  <path fill="none" stroke="#44403c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
